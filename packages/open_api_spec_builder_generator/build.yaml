builders:
  open_api_fragment_builder:
    import: "package:open_api_spec_builder_generator/build.dart"
    builder_factories: ["openapiFragmentBuilder"]
    build_extensions: {".dart": [".tmp.openapi.json"]}
    required_inputs: [".g.dart"]
    auto_apply: dependents
    build_to: cache
    runs_before: ["open_api_combining_builder"]

  open_api_combining_builder:
    import: "package:open_api_spec_builder_generator/build.dart"
    builder_factories: [ "openapiCombiningBuilder" ]
    required_inputs: [".tmp.openapi.json"]
    build_extensions: {"$lib$": ["openapi.json"]}
    auto_apply: dependents
    build_to: source

targets:
  $default:
    builders:
      json_serializable:
        options:
          include_if_null: false
